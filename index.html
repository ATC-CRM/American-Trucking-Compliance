<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American Trucking Compliance — CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--sb:#0C3B6E;--sb-muted:#7EB3E8;--header-bg:#1A6BC4;
--page-bg:#F0F4FA;--card-bg:#fff;--card-border:#C8D8EE;
--text-primary:#1a2535;--text-secondary:#4a5e7a;--text-muted:#7a8fa8;
--blue:#185FA5;--blue-light:#E6F1FB;--blue-dark:#0C3B6E;
--green:#2E7D32;--green-light:#E8F5E9;
--amber:#B45309;--amber-light:#FEF3C7;
--red:#C62828;--red-light:#FFEBEE;
--teal:#0F6E56;--teal-light:#E1F5EE;
--purple:#534AB7;--purple-light:#EEEDFE;
--input-bg:#F0F6FF;--input-border:#7EB3E8;--input-focus:#185FA5;
--radius:8px;--radius-lg:12px;
}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;background:var(--page-bg);min-height:100vh}
#app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sb);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.sb-logo{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}
.sb-logo-img{width:80px;height:80px;object-fit:contain;border-radius:10px;margin-bottom:6px}
.sb-logo-placeholder{width:80px;height:80px;background:#1A6BC4;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.sb-logo h1{font-size:11px;font-weight:700;color:#fff;line-height:1.3}
.sb-logo p{font-size:9px;color:var(--sb-muted);margin-top:2px}
.sb-nav{padding:8px 0;flex:1}
.sb-section{font-size:9px;font-weight:700;color:var(--sb-muted);letter-spacing:1px;padding:10px 16px 3px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;font-size:12px;color:var(--sb-muted);border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,0.12);color:#fff;border-left-color:#60A5FA;font-weight:600}
.nav-badge{margin-left:auto;background:#E24B4A;color:#fff;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700}
.nav-badge-blue{background:#1A6BC4}
.sb-user{padding:10px 16px;border-top:1px solid rgba(255,255,255,0.1)}
.sb-user-name{font-size:12px;font-weight:600;color:#fff}
.sb-user-role{font-size:10px;color:var(--sb-muted);margin-top:1px}
.sb-signout{margin-top:8px;padding:5px 10px;background:rgba(255,255,255,0.1);color:var(--sb-muted);border:1px solid rgba(255,255,255,0.15);border-radius:6px;cursor:pointer;font-size:10px;width:100%}
.sb-signout:hover{background:rgba(255,255,255,0.18);color:#fff}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.page-header{background:var(--header-bg);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50}
.page-header h2{font-size:15px;font-weight:700;color:#fff}
.page-header-sub{font-size:11px;color:rgba(255,255,255,0.7)}
.page-body{padding:16px;flex:1}
.btn{padding:7px 14px;border-radius:var(--radius);border:1.5px solid var(--card-border);background:var(--card-bg);color:var(--text-primary);cursor:pointer;font-size:12px;font-weight:600}
.btn:hover{background:#EEF4FF}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#0C447C;color:#fff}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{background:#1B5E20;color:#fff}
.btn-danger-solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn-danger-solid:hover{background:#B71C1C;color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-danger{color:var(--red);border-color:#FFCDD2}
.btn-danger:hover{background:#FFEBEE}
.btn-amber{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn-amber:hover{background:#92400e;color:#fff}
.card{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden}
.card-header{padding:10px 16px;background:#F0F6FF;border-bottom:1.5px solid var(--card-border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:13px;font-weight:700;color:var(--text-primary)}
.card-body{padding:14px 16px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:var(--radius-lg);padding:12px;text-align:center;border-top:4px solid var(--blue)}
.metric.danger{border-top-color:var(--red)}
.metric.warning{border-top-color:#EF9F27}
.metric.info{border-top-color:#378ADD}
.metric.success{border-top-color:var(--green)}
.metric-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:4px}
.metric-value{font-size:26px;font-weight:700;color:var(--text-primary)}
.metric.danger .metric-value{color:var(--red)}
.metric.warning .metric-value{color:var(--amber)}
.metric.info .metric-value{color:var(--blue)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-danger{background:var(--red-light);color:var(--red)}
.badge-warning{background:var(--amber-light);color:var(--amber)}
.badge-success{background:var(--green-light);color:var(--green)}
.badge-info{background:var(--blue-light);color:var(--blue-dark)}
.badge-gray{background:#F0F4FA;color:var(--text-muted);border:1px solid #C8D8EE}
.badge-teal{background:var(--teal-light);color:var(--teal)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-compliant{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7}
.badge-noncompliant{background:#FFEBEE;color:#C62828;border:1px solid #FFCDD2}
.table{width:100%;border-collapse:collapse;table-layout:fixed}
.table th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);padding:8px 10px;background:#F0F6FF;border-bottom:2px solid var(--card-border)}
.table td{padding:9px 10px;border-bottom:1px solid #E8F0FA;font-size:12px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.table tr:hover td{background:#F5F9FF}
.table tr:last-child td{border-bottom:none}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.3px}
.form-input{width:100%;padding:8px 11px;border:2px solid var(--input-border);border-radius:var(--radius);background:var(--input-bg);color:var(--text-primary);font-size:13px}
.form-input:focus{outline:none;border-color:var(--input-focus);background:#fff}
.form-input::placeholder{color:var(--text-muted)}
.form-select{width:100%;padding:8px 11px;border:2px solid var(--input-border);border-radius:var(--radius);background:var(--input-bg);color:var(--text-primary);font-size:13px}
.form-select:focus{outline:none;border-color:var(--input-focus)}
.form-textarea{width:100%;padding:8px 11px;border:2px solid var(--input-border);border-radius:var(--radius);background:var(--input-bg);color:var(--text-primary);font-size:13px;resize:vertical}
.form-textarea:focus{outline:none;border-color:var(--input-focus);background:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tab-bar{display:flex;border-bottom:2px solid var(--card-border);margin-bottom:14px;background:var(--card-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;overflow:hidden;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text-muted);border-bottom:3px solid transparent;margin-bottom:-2px;text-transform:uppercase;letter-spacing:0.3px}
.tab:hover{color:var(--text-primary);background:#F0F6FF}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);background:#EEF4FF}
.alert-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);margin-bottom:6px;background:var(--card-bg);border:1.5px solid var(--card-border);cursor:pointer}
.alert-row:hover{background:#F5F9FF;border-color:var(--blue)}
.alert-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(10,30,60,0.6);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:20px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--radius-lg);border:2px solid var(--card-border);width:100%;max-width:640px}
.modal-lg{max-width:820px}
.modal-header{padding:12px 18px;background:var(--header-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:14px;font-weight:700;color:#fff}
.modal-close{background:rgba(255,255,255,0.15);border:none;color:#fff;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px}
.modal-close:hover{background:rgba(255,255,255,0.25)}
.modal-body{padding:16px 18px}
.modal-footer{padding:10px 18px;border-top:1.5px solid var(--card-border);display:flex;justify-content:flex-end;gap:8px;background:#F0F6FF;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0C3B6E 0%,#1A6BC4 100%)}
.login-card{background:#fff;border-radius:16px;padding:32px;width:380px;border:2px solid var(--card-border)}
.chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;margin:2px}
.chip-dmv{background:#DBEAFE;color:#1e40af}
.chip-carb{background:#D1FAE5;color:#065f46}
.chip-irs{background:#EDE9FE;color:#4c1d95}
.chip-mcs{background:#FEF3C7;color:#92400e}
.chip-mc{background:#FCE7F3;color:#9D174D}
.chip-epn{background:#E0F2FE;color:#0369A1}
.chip-vin{background:#F3E8FF;color:#6D28D9}
.chip-acm{background:#ECFDF5;color:#065F46}
.paid-pill{cursor:pointer;user-select:none;display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;border:none}
.paid-pill.paid{background:var(--green-light);color:var(--green)}
.paid-pill.unpaid{background:#FEE2E2;color:#991B1B}
.due-block{background:#F0F6FF;border:1.5px solid var(--card-border);border-radius:var(--radius);padding:10px 12px}
.due-block-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);margin-bottom:3px}
.due-block-date{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:5px}
.activity-item{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.activity-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.notif{position:fixed;top:16px;right:16px;padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s}
.notif.show{opacity:1}
.doc-drop{border:2px dashed var(--input-border);border-radius:var(--radius-lg);padding:24px;text-align:center;background:var(--input-bg);cursor:pointer}
.doc-drop:hover,.doc-drop.dragover{border-color:var(--blue);background:#EEF4FF}
.doc-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:var(--radius);margin-bottom:7px}
.doc-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.doc-icon-pdf{background:#FFEBEE;color:#C62828}
.doc-icon-img{background:#E3F2FD;color:#1565C0}
.doc-icon-doc{background:#E8EAF6;color:#3949AB}
.doc-icon-xls{background:#E8F5E9;color:#2E7D32}
.doc-icon-other{background:#F3E5F5;color:#6A1B9A}
.gdrive-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#E8F5E9;color:#2E7D32}
.gdrive-pending{background:#FEF3C7;color:#B45309}
.svc-check{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:2px solid var(--card-border);border-radius:var(--radius);cursor:pointer;background:var(--card-bg);font-size:11px;font-weight:600;margin:3px}
.svc-check:hover{border-color:var(--blue);background:#F0F6FF}
.svc-check.checked{border-color:var(--blue);background:#EEF4FF;color:var(--blue)}
.svc-check input{accent-color:var(--blue);width:13px;height:13px}
.checklist-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border:1.5px solid var(--card-border);border-radius:var(--radius);margin-bottom:5px;background:var(--card-bg)}
.checklist-item input[type=checkbox]{accent-color:var(--blue);width:14px;height:14px;margin-top:1px;flex-shrink:0}
.checklist-item.checked-item{background:#F0FFF4;border-color:#A5D6A7;opacity:0.8}
.checklist-item label{font-size:12px;cursor:pointer;flex:1}
.section-divider{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);padding:10px 0 5px;display:flex;align-items:center;gap:8px}
.section-divider::after{content:'';flex:1;height:1px;background:var(--card-border)}
.compliance-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius);margin-bottom:5px;border:1.5px solid var(--card-border)}
.compliance-bar.compliant{background:#F0FFF4;border-color:#A5D6A7}
.compliance-bar.noncompliant{background:#FFF5F5;border-color:#FFCDD2}
.compliance-bar.pending{background:#FFFBEB;border-color:#FCD34D}
.doc-preview-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.doc-preview-inner{background:#fff;border-radius:12px;width:90%;max-width:900px;height:85vh;display:flex;flex-direction:column}
.doc-preview-header{padding:12px 16px;background:var(--header-bg);border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between}
.doc-preview-header span{color:#fff;font-weight:700;font-size:13px}
.doc-preview-body{flex:1;overflow:hidden;border-radius:0 0 12px 12px}
.doc-preview-body iframe{width:100%;height:100%;border:none}
.doc-preview-body .img-preview{width:100%;height:100%;object-fit:contain;padding:12px}
.unlinked-warning{background:#FEF3C7;border:1.5px solid #FCD34D;border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--amber)}
.carb-auto-hint{background:#E8F5E9;border:1.5px solid #A5D6A7;border-radius:var(--radius);padding:8px 12px;font-size:11px;color:var(--green);margin-top:5px}
</style>
</head>
<body>
<div id="app-root"></div>
<div id="notif" class="notif"></div>
<div id="doc-preview-root"></div>

<script>
const DB_KEY='atc_crm_v3';
const ALL_SVCS=['dmv','carb','irs2290','mcs150','epn','mc_permit','vin_verify','annual_compliance'];
const SL={dmv:'DMV Services',carb:'Clean Truck Check',irs2290:'IRS Form 2290',mcs150:'MCS-150',epn:'EPN',mc_permit:'MC Permit',vin_verify:'VIN Verification',annual_compliance:'Annual Compliance Mgmt'};
const SVC_CHIP={dmv:'chip-dmv',carb:'chip-carb',irs2290:'chip-irs',mcs150:'chip-mcs',mc_permit:'chip-mc',epn:'chip-epn',vin_verify:'chip-vin',annual_compliance:'chip-acm'};

// API Configuration defaults
const DEF_API_CONFIG={
  twilio:{accountSid:'',authToken:'',phoneNumber:'',enabled:false},
  googleDrive:{serviceAccountEmail:'',privateKey:'',enabled:false},
  googleSheets:{spreadsheetId:'',serviceAccountEmail:'',privateKey:'',enabled:false},
  gmail:{clientId:'',clientSecret:'',refreshToken:'',enabled:false},
  square:{accessToken:'',enabled:false}
};

// CARB compliance deadline maps
// CA Registered: DMV expiry month -> two testing deadline months
const CARB_CA={
  1:['Jan','Jul'],2:['Feb','Aug'],3:['Mar','Sep'],4:['Apr','Oct'],
  5:['May','Nov'],6:['Jun','Dec'],7:['Jan','Jul'],8:['Feb','Aug'],
  9:['Mar','Sep'],10:['Apr','Oct'],11:['May','Nov'],12:['Jun','Dec']
};

const CARB_NOCA={
  0:['Apr','Oct'],1:['May','Nov'],2:['Jun','Dec'],3:['Jan','Jul'],
  4:['Feb','Aug'],5:['Mar','Sep'],6:['Apr','Oct'],7:['May','Nov'],
  8:['Jun','Dec'],9:['Jan','Jul']
};
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_NUM={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};

// MCS-150 biennial schedule: last digit of USDOT -> filing month
const MCS150_MONTH={1:'January',2:'February',3:'March',4:'April',5:'May',6:'June',7:'July',8:'August',9:'September',0:'October'};

// Document checklists per service
const DOC_CHECKLISTS={
  dmv_renewal:{label:'DMV Standard Renewal',items:['Current CA vehicle registration card','Proof of insurance (CA)','Smog certificate (if required)','Payment for registration fees','Owner ID/driver license']},
  dmv_new:{label:'DMV New Registration',items:['Completed REG 343 Application','Certificate of Title or Manufacturer Certificate of Origin','Proof of insurance','Weight certification or weight slip','Payment of fees and use tax']},
  dmv_title:{label:'Title Transfer',items:['Signed title from seller','REG 343 Application for Title','Bill of sale','Odometer disclosure statement','Payment for transfer fees and use tax','Proof of insurance']},
  dmv_vin:{label:'VIN Verification',items:['Vehicle identification number (VIN) visible on vehicle','REG 343 or REG 31 form','Proof of ownership (title or registration)','Valid ID of applicant','Fees for VIN verification']},
  dmv_mcp:{label:'Motor Carrier Permit',items:['Business name and address','USDOT number','CA carrier identification number','Proof of insurance (MCP-65 or equivalent)','Carrier type and commodity info','Payment of MCP fees']},
  dmv_epn:{label:'EPN (Established Place of Business)',items:['Business license','Physical address verification','REG 31 form','CALER authorization documentation','Proof of bond or self-insurance']},
  irs2290:{label:'IRS Form 2290',items:['Vehicle Identification Number (VIN)','First use month of vehicle','Gross taxable weight of vehicle','Employer Identification Number (EIN)','Prior year 2290 Schedule 1 (if applicable)','Payment method for Heavy Vehicle Use Tax']},
  carb:{label:'CARB Clean Truck Check',items:['Vehicle VIN number','License plate number','Engine model year','Engine family name (from engine label)','CARB registration/fleet ID','Proof of current smog or certification (if applicable)','Testing appointment confirmation']},
  mcs150:{label:'MCS-150 Biennial Update',items:['USDOT number','Legal business name','Principal place of business address','Operation type and cargo classification','Number of power units and drivers','EIN or SSN','Signature of authorized person']}
};

let S={user:null,view:'login',tab:0,filter:'',selectedClient:null,modal:null,clients:[],trucks:[],activities:[],reminders:[],docs:[],users:[],docTemplates:[],smsTemplates:[],apiConfig:{}};

// Default SMS text message templates
const DEF_SMS_TEMPLATES=[
  {id:'sms1',name:'DMV Renewal Reminder',category:'reminder',body:'Hi [Client Name], this is American Trucking Compliance. Your DMV registration is coming up soon. Please call us at (951) 555-0000 so we can get started. Thank you!'},
  {id:'sms2',name:'CARB Clean Truck Check Reminder',category:'reminder',body:'Hi [Client Name], your CARB Clean Truck Check is due soon. Avoid fines — contact American Trucking Compliance at (951) 555-0000 to schedule. Thank you!'},
  {id:'sms3',name:'IRS Form 2290 Reminder',category:'reminder',body:'Hi [Client Name], your IRS Form 2290 (Heavy Vehicle Use Tax) filing is approaching. Contact us at (951) 555-0000 to get started. American Trucking Compliance.'},
  {id:'sms4',name:'MCS-150 Biennial Update Reminder',category:'reminder',body:'Hi [Client Name], your MCS-150 biennial update is due. Failure to file may suspend your USDOT. Call us at (951) 555-0000. American Trucking Compliance.'},
  {id:'sms5',name:'MC Permit Renewal Reminder',category:'reminder',body:'Hi [Client Name], your Motor Carrier Permit renewal is coming up. Contact American Trucking Compliance at (951) 555-0000 to renew. Thank you!'},
  {id:'sms6',name:'Document Request',category:'documents',body:'Hi [Client Name], we need a few documents from you to move forward. Please upload them to your Google Drive folder or call us at (951) 555-0000. Thank you!'},
  {id:'sms7',name:'Overdue — Action Required',category:'urgent',body:'URGENT: Hi [Client Name], you have a compliance item that is now OVERDUE. Please call American Trucking Compliance immediately at (951) 555-0000. Fines may apply.'},
  {id:'sms8',name:'Service Complete',category:'general',body:'Hi [Client Name], great news! Your compliance filing has been completed. Please contact us at (951) 555-0000 if you have any questions. American Trucking Compliance.'},
  {id:'sms9',name:'Payment Reminder',category:'general',body:'Hi [Client Name], this is a friendly reminder that your balance with American Trucking Compliance is due. Please call (951) 555-0000 to arrange payment. Thank you!'},
  {id:'sms10',name:'Appointment Confirmation',category:'general',body:'Hi [Client Name], your appointment with American Trucking Compliance has been confirmed. Please call (951) 555-0000 if you need to reschedule. See you soon!'},
  {id:'sms11',name:'Custom message',category:'custom',body:''}

function loadDB(){try{const d=localStorage.getItem(DB_KEY);return d?JSON.parse(d):null;}catch{return null;}}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify({users:S.users,clients:S.clients,trucks:S.trucks,activities:S.activities,reminders:S.reminders,docs:S.docs,docTemplates:S.docTemplates,smsTemplates:S.smsTemplates,apiConfig:S.apiConfig,session:S.user?{uid:S.user.id}:null}));}catch(e){console.error(e);}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function dU(d){if(!d)return null;const dt=new Date(d),n=new Date();n.setHours(0,0,0,0);dt.setHours(0,0,0,0);return Math.round((dt-n)/86400000);}
function fD(d){if(!d)return'—';const p=d.split('-');return`${p[1]}/${p[2]}/${p[0]}`;}
function rD(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().split('T')[0];}
function urgBadge(days){if(days===null)return'<span class="badge badge-gray">No date</span>';if(days<0)return`<span class="badge badge-danger">Overdue ${Math.abs(days)}d</span>`;if(days<=30)return`<span class="badge badge-danger">${days}d left</span>`;if(days<=60)return`<span class="badge badge-warning">${days}d left</span>`;if(days<=90)return`<span class="badge badge-info">${days}d left</span>`;return`<span class="badge badge-success">${days}d left</span>`;}
function urgDot(days){if(days===null)return'#aaa';if(days<0||days<=30)return'#E24B4A';if(days<=60)return'#EF9F27';if(days<=90)return'#378ADD';return'#639922';}
function docExt(name){const e=(name||'').split('.').pop().toLowerCase();if(e==='pdf')return['pdf','PDF'];if(['jpg','jpeg','png','gif','webp'].includes(e))return['img','IMG'];if(['doc','docx'].includes(e))return['doc','DOC'];if(['xls','xlsx','csv'].includes(e))return['xls','XLS'];return['other','FILE'];}
function notify(msg,type='success'){const el=document.getElementById('notif');if(!el)return;el.textContent=msg;el.style.background=type==='error'?'#C62828':type==='warning'?'#B45309':'#2E7D32';el.style.color='#fff';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200);}
function fmtSize(bytes){if(bytes<1024)return bytes+'B';if(bytes<1048576)return Math.round(bytes/1024)+'KB';return Math.round(bytes/1048576*10)/10+'MB';}

// Compute CARB dates from VIN/DMV month
function carbDatesFromVin(vin,dmvExpMonth,isCA){
  if(isCA&&dmvExpMonth){
    const m=parseInt(dmvExpMonth);
    const pair=CARB_CA[m];
    if(pair)return pair;
  }
  if(!isCA&&vin){
    const last=parseInt(vin[vin.length-1]);
    const pair=CARB_NOCA[last];
    if(pair)return pair;
  }
  return null;
}

// Build a year-specific date string from month name
function monthToNextDate(mName){
  const m=MONTH_NUM[mName];if(!m)return'';
  const now=new Date();let y=now.getFullYear();
  const target=new Date(y,m-1,28);
  if(target<now)target.setFullYear(y+1);
  return`${target.getFullYear()}-${String(m).padStart(2,'0')}-28`;
}

  return`<div class="page-header"><div><h2>Clients <span style="font-weight:400;font-size:13px;opacity:0.8">(${S.clients.length})</span></h2><div class="page-header-sub">All commercial truck owners</div></div><div style="display:flex;gap:6px"><button class="btn btn-sm" style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);color:#fff" data-action="view-unlinked">Unlinked trucks</button><button class="btn btn-success btn-sm" id="add-client-btn">+ Add client</button></div></div><div class="page-body"><div style="margin-bottom:12px"><input class="form-input" id="client-search" placeholder="Search by name, business, DOT number, phone..." value="${S.filter}" style="max-width:420px"></div><div class="card" style="overflow-x:auto"><table class="table"><thead><tr><th style="width:26%">Client / Business</th><th style="width:15%">Phone</th><th style="width:14%">DOT number</th><th style="width:24%">Services</th><th style="width:6%">Trucks</th><th style="width:9%">Status</th><th style="width:6%"></th></tr></thead><tbody>${filtered.length===0?'<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted)">No clients found</td></tr>':filtered.map(c=>{const trucks=S.trucks.filter(t=>t.clientId===c.id);const days=trucks.flatMap(t=>[dU(t.dmvExp),dU(t.carbDue1),dU(t.carbDue2),dU(t.irs2290Due),dU(t.mcs150Due||c.mcs150Due),dU(t.mcPermitDue||c.mcPermitDue)]).filter(x=>x!==null);const mn=days.length?Math.min(...days):null;let sb='<span class="badge badge-success">Current</span>';if(mn!==null){if(mn<0)sb='<span class="badge badge-danger">Overdue</span>';else if(mn<=30)sb='<span class="badge badge-danger">Due soon</span>';else if(mn<=60)sb='<span class="badge badge-warning">Upcoming</span>';else if(mn<=90)sb='<span class="badge badge-info">Scheduled</span>';}const ini=(c.businessName||'??').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();return`<tr><td style="cursor:pointer" data-action="view" data-id="${c.id}"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:#DBEAFE;color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${ini}</div><div><div style="font-weight:700;font-size:12px">${c.businessName}</div><div style="font-size:10px;color:var(--text-muted)">${c.name}</div></div></div></td><td>${c.phone||'—'}</td><td style="font-size:11px;color:var(--text-muted)">${c.dotNumber||'—'}</td><td>${c.services.slice(0,4).map(s=>`<span class="chip ${SVC_CHIP[s]||'badge-gray'}">${s==='dmv'?'DMV':s==='carb'?'CARB':s==='irs2290'?'IRS':s==='mcs150'?'MCS':s==='mc_permit'?'MC':s==='epn'?'EPN':s==='vin_verify'?'VIN':'ACM'}</span>`).join('')}${c.services.length>4?`<span class="chip badge-gray">+${c.services.length-4}</span>`:''}</td><td style="text-align:center;font-weight:700">${trucks.length}</td><td>${sb}</td><td><button class="btn btn-sm btn-danger" data-action="del-client" data-id="${c.id}" title="Delete client">✕</button></td></tr>`;}).join('')}</tbody></table></div></div>`;
}

function rDetail(){
  const c=S.clients.find(x=>x.id===S.selectedClient);if(!c)return rClients();
  const cTrucks=S.trucks.filter(t=>t.clientId===c.id);
  const cActs=S.activities.filter(a=>a.clientId===c.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const cDocs=S.docs.filter(d=>d.clientId===c.id);
  const TABS=['Overview','Trucks & Compliance','Activity log','Documents','Reminders','Checklists'];
  const ini=(c.businessName||'??').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return`<div class="page-header"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-sm" id="back-btn" style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);color:#fff">← Back</button><div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">${ini}</div><div><h2>${c.businessName}</h2><div class="page-header-sub">${c.name} · ${c.dotNumber||'No DOT'}</div></div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm" style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);color:#fff" data-action="edit-client" data-id="${c.id}">Edit</button><button class="btn btn-sm" style="background:#25D366;border-color:#1ebe57;color:#fff;font-weight:700" data-action="send-text" data-cid="${c.id}">💬 Send Text</button><button class="btn btn-success btn-sm" data-action="add-truck" data-cid="${c.id}">+ Add truck</button><button class="btn btn-sm btn-danger-solid" data-action="del-client" data-id="${c.id}">Delete client</button></div></div><div class="page-body"><div class="tab-bar">${TABS.map((t,i)=>`<div class="tab ${i===S.tab?'active':''}" data-tab="${i}">${t}${i===1?` (${cTrucks.length})`:i===3?` (${cDocs.length})`:''}</div>`).join('')}</div>${S.tab===0?rOverview(c):S.tab===1?rTrucks(c,cTrucks):S.tab===2?rActLog(c,cActs):S.tab===3?rClientDocs(c,cDocs):S.tab===4?rCRems(c):rClientChecklist(c)}</div>`;
}

function rOverview(c){
  return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="card"><div class="card-header"><h3>Contact information</h3></div><div class="card-body"><table style="width:100%;font-size:12px"><tr><td style="color:var(--text-muted);padding:5px 0;width:120px">Owner</td><td style="font-weight:600">${c.name||'—'}</td></tr><tr><td style="color:var(--text-muted);padding:5px 0">Phone</td><td><a href="tel:${c.phone}" style="color:var(--blue);font-weight:600">${c.phone||'—'}</a></td></tr><tr><td style="color:var(--text-muted);padding:5px 0">Email</td><td><a href="mailto:${c.email}" style="color:var(--blue)">${c.email||'—'}</a></td></tr><tr><td style="color:var(--text-muted);padding:5px 0">Address</td><td>${c.address||'—'}</td></tr></table></div></div><div class="card"><div class="card-header"><h3>Regulatory info</h3></div><div class="card-body"><table style="width:100%;font-size:12px"><tr><td style="color:var(--text-muted);padding:5px 0;width:120px">USDOT</td><td style="font-weight:600">${c.dotNumber||'—'}</td></tr><tr><td style="color:var(--text-muted);padding:5px 0">MC Permit</td><td>${c.motorCarrierPermit||'—'}</td></tr><tr><td style="color:var(--text-muted);padding:5px 0">MC Permit Due</td><td>${c.mcPermitDue?fD(c.mcPermitDue):'—'}</td></tr><tr><td style="color:var(--text-muted);padding:5px 0">MCS-150 filed</td><td>${fD(c.mcs150)}</td></tr><tr><td style="color:var(--text-muted);padding:5px 0">MCS-150 due</td><td>${c.mcs150Due?fD(c.mcs150Due):'—'} <span style="font-size:10px;color:var(--text-muted)">(every 2 yrs)</span></td></tr><tr><td style="color:var(--text-muted);padding:5px 0">Registration</td><td><span class="badge ${c.isCARegistered?'badge-info':'badge-gray'}">${c.isCARegistered?'CA Registered':'Non-CA / DMV Exempt'}</span></td></tr><tr><td style="color:var(--text-muted);padding:5px 0">Services</td><td>${c.services.map(s=>`<span class="chip ${SVC_CHIP[s]||''}">${SL[s]||s}</span>`).join(' ')||'None'}</td></tr></table></div></div>${c.notes?`<div class="card" style="grid-column:1/-1"><div class="card-header"><h3>Notes</h3></div><div class="card-body"><p style="font-size:12px;color:var(--text-secondary)">${c.notes}</p></div></div>`:''}</div><div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap"><a href="https://cleantruckcheck.arb.ca.gov/Fleet/Vehicle/VehicleComplianceStatusLookup" target="_blank" class="btn btn-sm" style="text-decoration:none">CARB lookup</a><a href="https://www.dmv.ca.gov/portal/vehicle-registration/registration-fees/vehicle-registration-fee-calculator/calculate-my-fees/" target="_blank" class="btn btn-sm" style="text-decoration:none">DMV fees</a><a href="https://account.tax2efile.com/Account/Login/?form=Tax2efile#!" target="_blank" class="btn btn-sm" style="text-decoration:none">IRS 2290 portal</a><a href="https://safer.fmcsa.dot.gov/CompanySnapshot.aspx" target="_blank" class="btn btn-sm" style="text-decoration:none">FMCSA lookup</a>${c.gdriveUrl?`<a href="${c.gdriveUrl}" target="_blank" class="btn btn-sm" style="text-decoration:none;background:var(--green-light);border-color:#A5D6A7;color:var(--green)">Open Google Drive</a>`:''}</div>`;
}

function rTrucks(c,trucks){
  if(!trucks.length)return`<div class="card"><div class="card-body"><p style="color:var(--text-muted)">No trucks added. Click "+ Add truck" above.</p></div></div>`;
  return trucks.map(t=>{
    const dd=dU(t.dmvExp),cd1=dU(t.carbDue1),cd2=dU(t.carbDue2),id=dU(t.irs2290Due);
    const mc=dU(t.mcPermitDue||c.mcPermitDue),ms=dU(t.mcs150Due||c.mcs150Due);
    function compBadge(compliant,days){if(compliant)return'<span class="badge-compliant badge" style="margin-left:4px">Compliant</span>';if(days!==null&&days<0)return'<span class="badge-noncompliant badge" style="margin-left:4px">Non-Compliant</span>';return'';}
    return`<div class="card"><div class="card-header"><div><span style="font-weight:700">${t.year} ${t.make} ${t.model}</span><span style="font-size:11px;color:var(--text-muted);margin-left:10px">Plate: ${t.plate}</span></div><div style="display:flex;gap:5px"><button class="btn btn-sm" data-action="link-truck" data-id="${t.id}" title="Link/reassign truck">🔗 Link</button><button class="btn btn-sm" data-action="edit-truck" data-id="${t.id}">Edit</button></div></div><div class="card-body"><div style="font-size:11px;color:var(--text-muted);margin-bottom:12px">VIN: ${t.vin} &nbsp;·&nbsp; GVW: ${parseInt(t.weight||0).toLocaleString()} lbs</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${c.services.includes('dmv')?`<div class="due-block"><div class="due-block-title">DMV Registration</div><div class="due-block-date">${fD(t.dmvExp)}</div><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px">${urgBadge(dd)}${compBadge(t.dmvCompliant,dd)}<span class="paid-pill ${t.dmvPaid?'paid':'unpaid'}" data-action="toggle-paid" data-truck="${t.id}" data-field="dmvPaid">${t.dmvPaid?'Paid':'Unpaid'}</span></div></div>`:''} ${c.services.includes('carb')?`<div class="due-block"><div class="due-block-title">Clean Truck Check #1</div><div class="due-block-date">${fD(t.carbDue1)}</div><div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px">${urgBadge(cd1)}${compBadge(t.carbCompliant,cd1)}<span class="paid-pill ${t.carbPaid?'paid':'unpaid'}" data-action="toggle-paid" data-truck="${t.id}" data-field="carbPaid">${t.carbPaid?'Paid':'Unpaid'}</span></div></div>`:''} ${c.services.includes('carb')?`<div class="due-block"><div class="due-block-title">Clean Truck Check #2</div><div class="due-block-date">${fD(t.carbDue2)}</div><div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px">${urgBadge(cd2)}</div></div>`:''} ${c.services.includes('irs2290')?`<div class="due-block"><div class="due-block-title">IRS Form 2290</div><div class="due-block-date">${fD(t.irs2290Due)}</div><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px">${urgBadge(id)}${compBadge(t.irsCompliant,id)}<span class="paid-pill ${t.irsPaid?'paid':'unpaid'}" data-action="toggle-paid" data-truck="${t.id}" data-field="irsPaid">${t.irsPaid?'Paid':'Unpaid'}</span></div></div>`:''} ${c.services.includes('mcs150')?`<div class="due-block"><div class="due-block-title">MCS-150</div><div class="due-block-date">${fD(t.mcs150Due||c.mcs150Due)}</div><div>${urgBadge(ms)}</div></div>`:''} ${c.services.includes('mc_permit')?`<div class="due-block"><div class="due-block-title">MC Permit</div><div class="due-block-date">${fD(t.mcPermitDue||c.mcPermitDue)}</div><div>${urgBadge(mc)}</div></div>`:''}</div><div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap"><button class="btn btn-sm" onclick="window.open('https://cleantruckcheck.arb.ca.gov/Fleet/Vehicle/VehicleComplianceStatusLookup','_blank')">CARB lookup</button><button class="btn btn-sm" onclick="window.open('https://www.dmv.ca.gov/portal/vehicle-registration/registration-fees/vehicle-registration-fee-calculator/calculate-my-fees/','_blank')">DMV fees</button><button class="btn btn-sm" data-action="toggle-compliant" data-truck="${t.id}" data-field="dmvCompliant">Mark DMV ${t.dmvCompliant?'Non-Compliant':'Compliant'}</button><button class="btn btn-sm" data-action="toggle-compliant" data-truck="${t.id}" data-field="carbCompliant">Mark CARB ${t.carbCompliant?'Non-Compliant':'Compliant'}</button></div></div></div>`;
  }).join('');
}

function rActLog(c,acts){
  const tL={call:'Phone call',email:'Email',note:'Note',sms:'SMS'};
  return`<div><div style="margin-bottom:10px"><button class="btn btn-primary btn-sm" data-action="add-activity" data-cid="${c.id}">+ Log activity</button></div>${acts.length===0?`<div class="card"><div class="card-body"><p style="color:var(--text-muted)">No activity logged yet.</p></div></div>`:acts.map(a=>{const u=S.users.find(x=>x.id===a.userId);return`<div class="card"><div class="card-body" style="padding:9px 14px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span class="badge badge-info">${tL[a.type]||a.type}</span><span style="font-size:11px;color:var(--text-muted)">${new Date(a.createdAt).toLocaleString()} · ${u?.name||'?'}</span></div><p style="font-size:12px">${a.note}</p></div></div>`;}).join('')}</div>`;
}

function rClientDocs(c,docs){
  return`<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px"><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" id="upload-doc-btn" data-cid="${c.id}">+ Upload document</button>${c.gdriveUrl?`<a href="${c.gdriveUrl}" target="_blank" class="btn btn-sm" style="text-decoration:none;background:var(--green-light);color:var(--green);border-color:#A5D6A7">Open Drive folder</a>`:''}</div><button class="btn btn-sm" data-action="set-gdrive" data-id="${c.id}">Set Drive folder URL</button></div>${!c.gdriveUrl?`<div class="unlinked-warning">No Google Drive folder linked. Click "Set Drive folder URL" to enable auto-sync.</div>`:''}<div class="doc-drop" id="drop-zone-${c.id}" data-cid="${c.id}"><div style="font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:4px">Drag &amp; drop files here</div><div style="font-size:11px;color:var(--text-muted)">or click Upload document above</div></div>${docs.length>0?`<div style="margin-top:12px">${docs.map(d=>{const[extClass,extLabel]=docExt(d.name);const synced=d.synced&&c.gdriveUrl;return`<div class="doc-item"><div class="doc-icon doc-icon-${extClass}">${extLabel}</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.name}</div><div style="font-size:10px;color:var(--text-muted)">${d.size||'—'} · ${new Date(d.uploadedAt).toLocaleDateString()} · ${S.users.find(u=>u.id===d.userId)?.name||'?'}</div></div><span class="${synced?'gdrive-badge':'gdrive-badge gdrive-pending'}">${synced?'Synced':'Pending sync'}</span><button class="btn btn-sm" data-action="preview-doc" data-id="${d.id}" data-name="${d.name}" data-type="${extClass}" data-url="${d.dataUrl||''}">Preview</button><button class="btn btn-sm btn-danger" data-action="del-doc" data-id="${d.id}">Remove</button></div>`;}).join('')}</div>`:`<p style="font-size:12px;color:var(--text-muted);margin-top:12px">No documents uploaded yet.</p>`}</div>`;
}

function rCRems(c){
  const cRems=S.reminders.filter(r=>r.clientId===c.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return`<div><div style="margin-bottom:10px;display:flex;gap:5px"><button class="btn btn-primary btn-sm" data-action="create-reminder" data-cid="${c.id}">+ Create reminder</button></div>${cRems.length===0?`<div class="card"><div class="card-body"><p style="color:var(--text-muted)">No reminders yet.</p></div></div>`:cRems.map(r=>{const sb=r.status==='pending'?'badge-warning':'badge-success';return`<div class="card"><div class="card-header"><div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap"><span class="badge ${sb}">${r.status}</span><span class="badge badge-gray">${(r.channel||'email').toUpperCase()}</span><span class="badge badge-purple">${r.serviceLabel||''}</span></div><span style="font-size:11px;color:var(--text-muted)">${new Date(r.createdAt).toLocaleDateString()}</span></div><div class="card-body"><pre style="font-size:12px;font-family:inherit;white-space:pre-wrap;background:#F0F6FF;padding:10px;border-radius:var(--radius);border:1.5px solid var(--card-border)">${r.message}</pre>${r.status==='pending'?`<div style="margin-top:7px;display:flex;gap:5px"><button class="btn btn-success btn-sm" data-action="approve-rem" data-id="${r.id}">Approve &amp; send</button><button class="btn btn-sm" data-action="edit-rem" data-id="${r.id}">Edit</button></div>`:''}</div></div>`;}).join('')}</div>`;
}

function rClientChecklist(c){
  const relevant=S.docTemplates.filter(t=>{
    if(c.services.includes('dmv')&&(t.service.startsWith('dmv')||t.service==='dmv_renewal'||t.service==='dmv_new'||t.service==='dmv_title'||t.service==='dmv_vin'||t.service==='dmv_mcp'||t.service==='dmv_epn'))return true;
    if(c.services.includes('irs2290')&&t.service==='irs2290')return true;
    if(c.services.includes('carb')&&t.service==='carb')return true;
    if(c.services.includes('mcs150')&&t.service==='mcs150')return true;
    return false;
  });
  return`<div><div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" data-action="send-checklist" data-cid="${c.id}">Send document checklist by email</button></div>${relevant.length===0?`<div class="card"><div class="card-body"><p style="color:var(--text-muted)">No checklists match this client's enrolled services. Add services in Edit client.</p></div></div>`:relevant.map(tmpl=>`<div class="card"><div class="card-header"><h3>${tmpl.name}</h3></div><div class="card-body">${tmpl.items.map((item,i)=>`<div class="checklist-item"><input type="checkbox" id="chk-${tmpl.id}-${i}"><label for="chk-${tmpl.id}-${i}">${item}</label></div>`).join('')}</div></div>`).join('')}</div>`;
}

function rDocsPage(){
  const total=S.docs.length;
  const synced=S.docs.filter(d=>{const c=S.clients.find(x=>x.id===d.clientId);return d.synced&&c?.gdriveUrl;}).length;
  return`<div class="page-header"><div><h2>Documents</h2><div class="page-header-sub">All client documents</div></div></div><div class="page-body"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px"><div class="metric success" style="border-top-width:4px"><div class="metric-label">Total docs</div><div class="metric-value" style="font-size:22px">${total}</div></div><div class="metric info" style="border-top-width:4px"><div class="metric-label">Synced to Drive</div><div class="metric-value" style="font-size:22px">${synced}</div></div><div class="metric warning" style="border-top-width:4px"><div class="metric-label">Pending sync</div><div class="metric-value" style="font-size:22px">${total-synced}</div></div></div><div class="card"><div class="card-header"><h3>All documents</h3></div><div class="card-body">${S.docs.length===0?'<p style="color:var(--text-muted)">No documents uploaded yet.</p>':S.docs.map(d=>{const c=S.clients.find(x=>x.id===d.clientId);const[extClass,extLabel]=docExt(d.name);const s2=d.synced&&c?.gdriveUrl;return`<div class="doc-item"><div class="doc-icon doc-icon-${extClass}">${extLabel}</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.name}</div><div style="font-size:10px;color:var(--text-muted)">${c?.businessName||'Unknown'} · ${d.size||'—'} · ${new Date(d.uploadedAt).toLocaleDateString()}</div></div><span class="${s2?'gdrive-badge':'gdrive-badge gdrive-pending'}">${s2?'Synced':'Pending sync'}</span><button class="btn btn-sm" data-action="preview-doc" data-id="${d.id}" data-name="${d.name}" data-type="${extClass}" data-url="${d.dataUrl||''}">Preview</button><button class="btn btn-sm" data-action="go-client" data-id="${d.clientId}">View client</button></div>`;}).join('')}</div></div><div class="card"><div class="card-header"><h3>Google Drive integration</h3></div><div class="card-body"><p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">Link a Google Drive folder URL to each client profile to enable auto-sync. Documents will be marked synced when a Drive folder is linked.</p><a href="https://drive.google.com" target="_blank" class="btn btn-sm" style="text-decoration:none">Open Google Drive</a></div></div></div>`;

// CARB auto-fill helpers (exposed globally for oninput)
window.autoCarbDates=function(vin,cid){
  const c=S.clients.find(x=>x.id===cid);
  if(!c||c.isCARegistered!==false||!vin||vin.length<1)return;
  const last=parseInt(vin[vin.length-1]);
  const pair=CARB_NOCA[last];
  if(!pair)return;
  const d1=document.getElementById('f-carb1');const d2=document.getElementById('f-carb2');const msg=document.getElementById('carb-auto-msg');
  if(d1)d1.value=monthToNextDate(pair[0]);
  if(d2)d2.value=monthToNextDate(pair[1]);
  if(msg)msg.style.display='block';
};
window.autoCarbFromDmv=function(dmvDate,cid){
  const c=S.clients.find(x=>x.id===cid);
  if(!c||c.isCARegistered===false||!dmvDate)return;
  const m=new Date(dmvDate).getMonth()+1;
  const pair=CARB_CA[m];if(!pair)return;
  const d1=document.getElementById('f-carb1');const d2=document.getElementById('f-carb2');const msg=document.getElementById('carb-auto-msg');
  if(d1)d1.value=monthToNextDate(pair[0]);
  if(d2)d2.value=monthToNextDate(pair[1]);
  if(msg)msg.style.display='block';
};
window.previewChecklist=function(tmplId,cid){
  const c=S.clients.find(x=>x.id===cid);const t=S.docTemplates.find(x=>x.id===tmplId);if(!t||!c)return;
  const body=(t.emailBody||'').replace('[Client Name]',c.name||'').replace('[DOCUMENT LIST]',t.items.map(i=>`• ${i}`).join('\n')).replace('[GOOGLE DRIVE LINK]',c.gdriveUrl||'[Upload link]');
  const subj=document.getElementById('f-send-subj');const bodyEl=document.getElementById('f-send-body');
  if(subj)subj.value=t.emailSubject||'';
  if(bodyEl)bodyEl.value=body;
};

async function genReminders(){
  let n=0;
  S.trucks.forEach(t=>{
    const c=S.clients.find(x=>x.id===t.clientId);if(!c)return;
    const checks=[
      {svc:'dmv',date:t.dmvExp,label:SL.dmv},{svc:'carb',date:t.carbDue1,label:'Clean Truck Check #1'},
      {svc:'carb',date:t.carbDue2,label:'Clean Truck Check #2'},{svc:'irs2290',date:t.irs2290Due,label:SL.irs2290},
      {svc:'mcs150',date:t.mcs150Due||c.mcs150Due,label:SL.mcs150},{svc:'mc_permit',date:t.mcPermitDue||c.mcPermitDue,label:SL.mc_permit}
    ];
    checks.forEach(ch=>{
      if(!c.services.includes(ch.svc)||!ch.date)return;
      const days=dU(ch.date);if(days===null||days>90)return;
      if(S.reminders.find(r=>r.clientId===c.id&&r.service===ch.svc&&r.truckId===t.id&&r.serviceLabel===ch.label&&r.status==='pending'))return;
      const urg=days<0?`is OVERDUE by ${Math.abs(days)} days`:days<=30?`is due in ${days} days`:days<=60?`is coming up in ${days} days`:`is scheduled in ${days} days`;
      S.reminders.push({id:uid(),clientId:c.id,truckId:t.id,userId:S.user.id,service:ch.svc,serviceLabel:ch.label,channel:'email',message:`Hi ${c.name},\n\nThis is an important compliance reminder from American Trucking Compliance.\n\nYour ${ch.label} for your ${t.year} ${t.make} ${t.model} (Plate: ${t.plate}) ${urg}${days>=0?' — due '+fD(ch.date):''}.\n\nPlease contact us immediately so we can assist you.\n\nSincerely,\nAmerican Trucking Compliance Team\n(951) 555-0000`,status:'pending',createdAt:new Date().toISOString()});
      n++;
    });
  });
  saveDB();return n;
}

// TWILIO SMS — FULLY FUNCTIONAL
// ─────────────────────────────────────────────
async function sendTwilioSMS(to,message){
  const cfg=S.apiConfig?.twilio;
  if(!cfg||!cfg.enabled||!cfg.accountSid||!cfg.authToken||!cfg.phoneNumber){
    notify('Twilio not configured or not enabled. Go to Settings → API Integrations.','error');
    return false;
  }
  // Normalize phone: strip non-digits then add +1 if needed
  let phone=to.replace(/\D/g,'');
  if(phone.length===10)phone='+1'+phone;
  else if(phone.length===11&&phone[0]==='1')phone='+'+phone;
  else phone='+'+phone;
  try{
    const auth=btoa(`${cfg.accountSid}:${cfg.authToken}`);
    const params=new URLSearchParams({To:phone,From:cfg.phoneNumber,Body:message});
    const resp=await fetch(`https://api.twilio.com/2010-04-01/Accounts/${cfg.accountSid}/Messages.json`,{
      method:'POST',
      headers:{'Authorization':`Basic ${auth}`,'Content-Type':'application/x-www-form-urlencoded'},
      body:params.toString()
    });
    const data=await resp.json();
    if(!resp.ok||data.status==='failed'){
      notify(`Twilio error: ${data.message||data.error_message||'Unknown error'}`,'error');
      return false;
    }
    return true;
  }catch(e){
    notify(`SMS failed: ${e.message}`,'error');
    return false;
  }
}

// ─────────────────────────────────────────────
// GMAIL — OAuth2 access token refresh + send
// ─────────────────────────────────────────────
async function getGmailAccessToken(){
  const cfg=S.apiConfig?.gmail;
  if(!cfg?.clientId||!cfg?.clientSecret||!cfg?.refreshToken)return null;
  try{
    const resp=await fetch('https://oauth2.googleapis.com/token',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({client_id:cfg.clientId,client_secret:cfg.clientSecret,refresh_token:cfg.refreshToken,grant_type:'refresh_token'}).toString()
    });
    const data=await resp.json();
    if(data.access_token){
      // Cache token with expiry
      S.apiConfig.gmail._accessToken=data.access_token;
      S.apiConfig.gmail._tokenExpiry=Date.now()+(data.expires_in-60)*1000;
      return data.access_token;
    }
    notify(`Gmail token error: ${data.error_description||data.error}`,'error');
    return null;
  }catch(e){notify(`Gmail auth failed: ${e.message}`,'error');return null;}
}

async function sendGmailEmail(to,subject,bodyText){
  const cfg=S.apiConfig?.gmail;
  if(!cfg||!cfg.enabled){
    // Fallback to mailto
    window.location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
    return false;
  }
  // Use cached token if still valid
  let token=cfg._accessToken&&cfg._tokenExpiry>Date.now()?cfg._accessToken:await getGmailAccessToken();
  if(!token){
    notify('Gmail: could not get access token. Check credentials in Settings.','error');
    window.location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
    return false;
  }
  try{
    // Build RFC 2822 message
    const msg=[
      `To: ${to}`,
      `Subject: ${subject}`,
      'MIME-Version: 1.0',
      'Content-Type: text/plain; charset=UTF-8',
      '',
      bodyText
    ].join('\r\n');
    // Base64url encode
    const encoded=btoa(unescape(encodeURIComponent(msg))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const resp=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
      method:'POST',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({raw:encoded})
    });
    const data=await resp.json();
    if(!resp.ok){
      notify(`Gmail send error: ${data.error?.message||'Unknown'}`,'error');
      return false;
    }
    return true;
  }catch(e){notify(`Gmail send failed: ${e.message}`,'error');return false;}
}

// ─────────────────────────────────────────────
// GOOGLE DRIVE — Service Account JWT + upload
// ─────────────────────────────────────────────
async function getGoogleAccessToken(scope){
  const cfg=S.apiConfig?.googleDrive;
  if(!cfg?.serviceAccountEmail||!cfg?.privateKey)return null;
  try{
    // Build JWT
    const now=Math.floor(Date.now()/1000);
    const header=btoa(JSON.stringify({alg:'RS256',typ:'JWT'})).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const claim=btoa(JSON.stringify({iss:cfg.serviceAccountEmail,scope,aud:'https://oauth2.googleapis.com/token',exp:now+3600,iat:now})).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const unsigned=`${header}.${claim}`;
    // Import private key
    const pemBody=cfg.privateKey.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n|\r/g,'');
    const keyBytes=Uint8Array.from(atob(pemBody),c=>c.charCodeAt(0));
    const cryptoKey=await crypto.subtle.importKey('pkcs8',keyBytes.buffer,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
    const sigBytes=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',cryptoKey,new TextEncoder().encode(unsigned));
    const sig=btoa(String.fromCharCode(...new Uint8Array(sigBytes))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const jwt=`${unsigned}.${sig}`;
    // Exchange for access token
    const resp=await fetch('https://oauth2.googleapis.com/token',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:jwt}).toString()
    });
    const data=await resp.json();
    return data.access_token||null;
  }catch(e){console.error('Google token error',e);return null;}
}

// Extract folder ID from a Drive URL
function driveUrlToFolderId(url){
  if(!url)return null;
  const m=url.match(/folders\/([a-zA-Z0-9_-]+)/);
  return m?m[1]:null;
}

async function uploadToGoogleDrive(clientId,fileName,dataUrl){
  const cfg=S.apiConfig?.googleDrive;
  const c=S.clients.find(x=>x.id===clientId);
  if(!cfg||!cfg.enabled){return false;}
  const folderId=driveUrlToFolderId(c?.gdriveUrl);
  const token=await getGoogleAccessToken('https://www.googleapis.com/auth/drive.file');
  if(!token){notify('Google Drive: authentication failed. Check service account credentials.','error');return false;}
  try{
    // Convert dataUrl to blob
    const[meta,b64]=dataUrl.split(',');
    const mime=meta.match(/:(.*?);/)[1];
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    // Multipart upload
    const boundary='ATC_CRM_BOUNDARY';
    const metaPart=JSON.stringify({name:fileName,...(folderId?{parents:[folderId]}:{})});
    const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metaPart}\r\n--${boundary}\r\nContent-Type: ${mime}\r\nContent-Transfer-Encoding: base64\r\n\r\n${btoa(String.fromCharCode(...bytes))}\r\n--${boundary}--`;
    const resp=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
      method:'POST',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':`multipart/related; boundary=${boundary}`},
      body
    });
    const data=await resp.json();
    if(!resp.ok){notify(`Drive upload error: ${data.error?.message||'Unknown'}`,'error');return false;}
    return data.id||true;
  }catch(e){notify(`Drive upload failed: ${e.message}`,'error');return false;}
}

// ─────────────────────────────────────────────
// GOOGLE SHEETS — append / update rows
// ─────────────────────────────────────────────
async function getSheetsToken(){
  // Reuse Drive service account for Sheets if emails match
  const driveCfg=S.apiConfig?.googleDrive;
  const sheetCfg=S.apiConfig?.googleSheets;
  // Prefer sheets-specific key, fall back to drive
  const email=sheetCfg?.serviceAccountEmail||driveCfg?.serviceAccountEmail;
  const key=sheetCfg?.privateKey||driveCfg?.privateKey;
  if(!email||!key)return null;
  const tmpCfg={serviceAccountEmail:email,privateKey:key};
  const saved=S.apiConfig.googleDrive;
  S.apiConfig.googleDrive=tmpCfg;
  const token=await getGoogleAccessToken('https://www.googleapis.com/auth/spreadsheets');
  S.apiConfig.googleDrive=saved;
  return token;
}

async function sheetsAppend(sheetName,values){
  const cfg=S.apiConfig?.googleSheets;
  if(!cfg?.enabled||!cfg?.spreadsheetId)return false;
  const token=await getSheetsToken();
  if(!token){notify('Google Sheets: auth failed. Check credentials.','error');return false;}
  try{
    const id=encodeURIComponent(cfg.spreadsheetId);
    const range=encodeURIComponent(`${sheetName}!A1`);
    const resp=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${range}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({values})
    });
    const data=await resp.json();
    if(!resp.ok){notify(`Sheets error: ${data.error?.message||'Unknown'}`,'error');return false;}
    return true;
  }catch(e){notify(`Sheets append failed: ${e.message}`,'error');return false;}
}

async function sheetsClearAndWrite(sheetName,rows){
  const cfg=S.apiConfig?.googleSheets;
  if(!cfg?.enabled||!cfg?.spreadsheetId)return false;
  const token=await getSheetsToken();
  if(!token)return false;
  try{
    const id=encodeURIComponent(cfg.spreadsheetId);
    const range=encodeURIComponent(`${sheetName}!A1:ZZ`);
    // Clear first
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${range}:clear`,{
      method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'}
    });
    // Then write
    const writeRange=encodeURIComponent(`${sheetName}!A1`);
    const resp=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${writeRange}?valueInputOption=USER_ENTERED`,{
      method:'PUT',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({values:rows})
    });
    return resp.ok;
  }catch(e){notify(`Sheets write failed: ${e.message}`,'error');return false;}
}

function triggerUpload(cid){
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='.pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.gif,.webp,.txt';
  inp.onchange=e=>processFiles(Array.from(e.target.files),cid);
  inp.click();
}

function processFiles(files,clientId){
  const c=S.clients.find(x=>x.id===clientId);
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=async ev=>{
      const doc={id:uid(),clientId,name:f.name,size:fmtSize(f.size),userId:S.user.id,uploadedAt:new Date().toISOString(),synced:false,dataUrl:ev.target.result};
      S.docs.push(doc);
      // Auto-upload to Google Drive if enabled and client has a folder
      if(S.apiConfig?.googleDrive?.enabled&&c?.gdriveUrl){
        notify(`Uploading ${f.name} to Google Drive...`);
        const result=await uploadToGoogleDrive(clientId,f.name,ev.target.result);
        if(result){doc.synced=true;doc.driveFileId=typeof result==='string'?result:undefined;notify(`${f.name} uploaded to Google Drive ✅`);}
        else{notify(`Drive upload failed for ${f.name} — saved locally only`,'warning');}
      }else{
        doc.synced=!!(c?.gdriveUrl);
      }
      saveDB();render();
    };reader.readAsDataURL(f);
  });
  notify(`${files.length} document(s) uploading...`);
}

// ─────────────────────────────────────────────
// SQUARE — look up payments by customer email
// ─────────────────────────────────────────────
async function checkSquarePayments(){
  const cfg=S.apiConfig?.square;
  if(!cfg?.enabled||!cfg?.accessToken){notify('Square not configured or not enabled.','error');return;}
  notify('Checking Square for recent payments...');
  try{
    const resp=await fetch('https://connect.squareup.com/v2/payments?sort_order=DESC&limit=50',{
      headers:{'Authorization':`Bearer ${cfg.accessToken}`,'Square-Version':'2024-01-17','Content-Type':'application/json'}
    });
    const data=await resp.json();
    if(!resp.ok){notify(`Square error: ${data.errors?.[0]?.detail||'Unknown'}`,'error');return;}
    const payments=data.payments||[];
    let matched=0;
    payments.forEach(p=>{
      if(p.status!=='COMPLETED')return;
      const email=p.buyer_email_address?.toLowerCase();
      const c=S.clients.find(x=>x.email?.toLowerCase()===email);
      if(!c)return;
      // Mark most recent relevant service as paid based on amount
      const amount=(p.amount_money?.amount||0)/100;
      const trucks=S.trucks.filter(t=>t.clientId===c.id);
      trucks.forEach(t=>{
        if(!t.irsPaid&&amount>=550){t.irsPaid=true;matched++;}
        else if(!t.dmvPaid&&amount>=100){t.dmvPaid=true;matched++;}
        else if(!t.carbPaid&&amount>=50){t.carbPaid=true;matched++;}
      });
    });
    saveDB();
    if(matched>0){render();notify(`Square sync: ${matched} payment(s) marked as paid ✅`);}
    else notify('Square sync complete — no new matching payments found.');
  }catch(e){notify(`Square sync failed: ${e.message}`,'error');}
}
